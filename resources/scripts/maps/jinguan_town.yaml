id: jinguan_town
name: "津关镇"
desc: "渡口、官道和三条山路在这里交错。镇不大，却有足够多的人把江湖藏在门后。"
rooms:
  - position: [0, -3]
    id: jinguan_south_ferry
    name: "南渡口"
    desc: "渡口的木桩被雨水泡得发黑。往南还能看见冷雨客栈外的官道，往北便是津关镇的石桥。"
    exits:
      north: [0, -2]
      south:
        map: mountain_pass
        position: [0, 0]

  - position: [0, -2]
    id: jinguan_stone_bridge
    name: "石桥"
    desc: "桥下浅水急急流过，桥栏上刻着许多旧刀痕。"
    exits:
      north: [0, -1]
      south: [0, -3]
      west: [-1, -2]
      east: [1, -2]

  - position: [-1, -2]
    id: jinguan_willow_bank
    name: "柳岸"
    desc: "几株老柳伏在水边，枝条像疲倦的手。"
    exits:
      east: [0, -2]
      north: [-1, -1]

  - position: [1, -2]
    id: jinguan_boat_shed
    name: "船棚"
    desc: "棚下堆着缆绳、破桨和几盏备用风灯。"
    exits:
      west: [0, -2]
      north: [1, -1]

  - position: [0, -1]
    id: jinguan_south_gate
    name: "南门"
    desc: "南门不高，门洞里避雨的人却不少。一个灰衣引路人靠墙站着，像在等新来的江湖客。"
    char:
      - town_guide
    exits:
      north: [0, 0]
      south: [0, -2]
      west: [-1, -1]
      east: [1, -1]

  - position: [-1, -1]
    id: jinguan_training_yard
    name: "演武场"
    desc: "地面铺着粗砂，雨水一落就被踩碎。墙边立着木桩和竹刀。"
    char:
      - martial_hall_instructor
    exits:
      east: [0, -1]
      west: [-2, -1]
      south: [-1, -2]
      north: [-1, 0]

  - position: [-2, -1]
    id: jinguan_martial_hall
    name: "孤灯武馆"
    desc: "武馆里只点一盏灯。灯下挂着四个字：先活下来。"
    exits:
      east: [-1, -1]
      west: [-3, -1]
      north: [-2, 0]

  - position: [-3, -1]
    id: jinguan_money_house
    name: "钱庄"
    desc: "柜台后的铁算盘响得很慢，像每一枚铜钱都有自己的来历。"
    exits:
      east: [-2, -1]
      north: [-3, 0]

  - position: [1, -1]
    id: jinguan_academy
    name: "旧书院"
    desc: "书院檐下挂着半卷竹帘，墨香被雨气泡得很淡。"
    char:
      - old_scribe
    exits:
      west: [0, -1]
      east: [2, -1]
      south: [1, -2]
      north: [1, 0]

  - position: [2, -1]
    id: jinguan_yamen
    name: "镇衙"
    desc: "镇衙门口有两面褪色鼓，鼓皮上补过一块新革。"
    exits:
      west: [1, -1]
      east: [3, -1]
      north: [2, 0]

  - position: [3, -1]
    id: jinguan_warehouse
    name: "官仓"
    desc: "仓门紧闭，门缝里透出谷米和潮木头的气味。"
    exits:
      west: [2, -1]
      north: [3, 0]

  - position: [0, 0]
    id: jinguan_market_cross
    name: "镇心十字街"
    desc: "四条街在此交汇。摊贩的叫卖声、驿马的鼻息和茶客的低语混在一起。"
    exits:
      north: [0, 1]
      south: [0, -1]
      west: [-1, 0]
      east: [1, 0]

  - position: [-1, 0]
    id: jinguan_west_market
    name: "西市"
    desc: "西市多卖旧物，刀鞘、药瓶、破书和无主的鞋都在雨棚下排着。"
    exits:
      east: [0, 0]
      west: [-2, 0]
      south: [-1, -1]
      north: [-1, 1]

  - position: [-2, 0]
    id: jinguan_west_lane
    name: "西巷"
    desc: "巷子窄得两个人错身也要侧肩。墙根有新旧不一的脚印。"
    exits:
      east: [-1, 0]
      west: [-3, 0]
      south: [-2, -1]
      north: [-2, 1]

  - position: [-3, 0]
    id: jinguan_pawnshop
    name: "当铺"
    desc: "当铺门匾写着一个很大的当字。掌柜看人的眼神比秤砣还沉。"
    exits:
      east: [-2, 0]
      south: [-3, -1]
      north: [-3, 1]

  - position: [1, 0]
    id: jinguan_east_market
    name: "东市"
    desc: "东市卖的多是新货。铁器、药材、伞布和灯油挤满了摊子。"
    exits:
      west: [0, 0]
      east: [2, 0]
      south: [1, -1]
      north: [1, 1]

  - position: [2, 0]
    id: jinguan_east_lane
    name: "东巷"
    desc: "东巷通向镇衙后墙，来往的多是脚步很急的人。"
    exits:
      west: [1, 0]
      east: [3, 0]
      south: [2, -1]
      north: [2, 1]

  - position: [3, 0]
    id: jinguan_apothecary
    name: "药铺"
    desc: "柜上放着药碾，墙上挂满抽屉。药香里混着一点苦雨味。"
    char:
      - town_physician
    exits:
      west: [2, 0]
      south: [3, -1]
      north: [3, 1]

  - position: [0, 1]
    id: jinguan_drum_tower
    name: "鼓楼"
    desc: "鼓楼是镇里最高的地方。雨天看不远，却能听见四面来的脚步声。"
    exits:
      north: [0, 2]
      south: [0, 0]
      west: [-1, 1]
      east: [1, 1]

  - position: [-1, 1]
    id: jinguan_inn
    name: "津关客店"
    desc: "客店里火盆烧得正旺，住客说话都压着嗓子。"
    exits:
      east: [0, 1]
      west: [-2, 1]
      south: [-1, 0]
      north: [-1, 2]

  - position: [-2, 1]
    id: jinguan_tea_house
    name: "雨棚茶肆"
    desc: "茶肆没有墙，只有竹帘。说书人敲着醒木，像在替江湖计时。"
    char:
      - tea_storyteller
    exits:
      east: [-1, 1]
      west: [-3, 1]
      south: [-2, 0]
      north: [-2, 2]

  - position: [-3, 1]
    id: jinguan_notice_wall
    name: "公告墙"
    desc: "墙上贴着寻人、悬赏、失物和门派收徒的旧纸。新雨把墨迹洇成一片。"
    exits:
      east: [-2, 1]
      south: [-3, 0]
      north: [-3, 2]

  - position: [1, 1]
    id: jinguan_smithy
    name: "铁匠铺"
    desc: "炉火照亮半条街。铁匠把一截红铁放进雨水里，白气轰然升起。"
    char:
      - town_blacksmith
    exits:
      west: [0, 1]
      east: [2, 1]
      south: [1, 0]
      north: [1, 2]

  - position: [2, 1]
    id: jinguan_stable
    name: "马厩"
    desc: "几匹驿马在棚下甩着鬃毛。驿卒说北路近来不太平。"
    char:
      - post_runner
    exits:
      west: [1, 1]
      east: [3, 1]
      south: [2, 0]
      north: [2, 2]

  - position: [3, 1]
    id: jinguan_herb_stall
    name: "药材摊"
    desc: "摊上晒着半干的草药。摊主把药名说得像江湖外号。"
    exits:
      west: [2, 1]
      south: [3, 0]
      north: [3, 2]

  - position: [0, 2]
    id: jinguan_north_street
    name: "北街"
    desc: "北街比南街冷清，行人多带兵器，话也少。"
    exits:
      north: [0, 3]
      south: [0, 1]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: jinguan_shrine
    name: "小武庙"
    desc: "庙小，香火却不冷。墙角放着几只给新手避祸用的旧灯笼。"
    exits:
      east: [0, 2]
      west: [-2, 2]
      south: [-1, 1]
      north: [-1, 3]

  - position: [-2, 2]
    id: jinguan_hanyi_lodge
    name: "寒雨接引亭"
    desc: "亭里挂着一柄无锋木剑。亭柱上刻着：听雨者入门。"
    char:
      - hanyi_runner
    exits:
      east: [-1, 2]
      west: [-3, 2]
      south: [-2, 1]
      north:
        map: hanyi_men
        position: [0, 0]

  - position: [-3, 2]
    id: jinguan_old_well
    name: "老井"
    desc: "井水很深，低头看久了，像能看见别人的秘密。"
    exits:
      east: [-2, 2]
      south: [-3, 1]
      north: [-2, 3]

  - position: [1, 2]
    id: jinguan_patrol_office
    name: "巡捕房"
    desc: "墙上挂着几张悬赏。墨还新，血却已经旧了。"
    char:
      - town_constable
    exits:
      west: [0, 2]
      east: [2, 2]
      south: [1, 1]
      north: [1, 3]

  - position: [2, 2]
    id: jinguan_tieyi_post
    name: "铁衣帮分舵"
    desc: "门前堆着麻包和铁棍。一个帮众坐在雨棚下补护腕。"
    char:
      - tieyi_runner
    exits:
      west: [1, 2]
      east: [3, 2]
      south: [2, 1]
      north:
        map: tieyi_bang
        position: [0, 0]

  - position: [3, 2]
    id: jinguan_yaowang_cart
    name: "药王谷车棚"
    desc: "车棚下停着一辆药车，车铃很轻，像怕惊醒病人。"
    char:
      - yaowang_runner
    exits:
      west: [2, 2]
      south: [3, 1]
      north:
        map: yaowang_gu
        position: [0, 0]

  - position: [0, 3]
    id: jinguan_north_gate
    name: "北门"
    desc: "北门外就是黑松路。风从门外吹来，带着树脂和刀油的味道。"
    exits:
      north: [0, 4]
      south: [0, 2]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: jinguan_west_watch
    name: "西望台"
    desc: "望台能看见寒雨山门的一线屋檐。雨重时，那屋檐像一笔墨痕。"
    exits:
      east: [0, 3]
      west: [-2, 3]
      south: [-1, 2]

  - position: [-2, 3]
    id: jinguan_back_alley
    name: "后巷"
    desc: "后巷通向几户闭门人家。门环擦得很亮，像常有人夜里来敲。"
    exits:
      east: [-1, 3]
      south: [-3, 2]

  - position: [1, 3]
    id: jinguan_east_watch
    name: "东望台"
    desc: "望台下能看见铁衣帮和药王谷两条路，像两种完全不同的命。"
    exits:
      west: [0, 3]
      east: [2, 3]
      south: [1, 2]

  - position: [2, 3]
    id: jinguan_pack_yard
    name: "脚夫场"
    desc: "脚夫们把货担搁在棚下，等雨小，也等雇主心软。"
    exits:
      west: [1, 3]
      south: [2, 2]

  - position: [0, 4]
    id: jinguan_north_outskirts
    name: "北郊"
    desc: "镇声在身后渐远，黑松路在前方铺开。路边石碑写着：夜行自负。"
    exits:
      south: [0, 3]
      north:
        map: black_pine_road
        position: [0, 0]
