id: yaowang_gu
name: "药王谷"
desc: "药王谷夹在两道青山之间。谷中不问胜负，先问脉象。"
rooms:
  - position: [0, 0]
    id: yaowang_cart_stop
    name: "药车停处"
    desc: "药车停在谷口，车铃轻轻晃着。回头就是津关镇。"
    exits:
      south:
        map: jinguan_town
        position: [3, 2]
      north: [0, 1]

  - position: [0, 1]
    id: yaowang_bamboo_path
    name: "竹径"
    desc: "竹叶被雨洗得很亮，路边插着写有药名的小木牌。"
    exits:
      south: [0, 0]
      north: [0, 2]

  - position: [0, 2]
    id: yaowang_outer_valley
    name: "外谷"
    desc: "外谷里晒着草药。药童走路很轻，怕踩坏刚冒头的新芽。"
    char:
      - yaowang_herb_boy
    exits:
      south: [0, 1]
      north: [0, 3]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: yaowang_drying_rack
    name: "晒药架"
    desc: "木架上铺着根茎叶花，每一格味道都不同。"
    exits:
      east: [0, 2]
      north: [-1, 3]

  - position: [1, 2]
    id: yaowang_stream
    name: "洗药溪"
    desc: "溪水很浅，水底压着细白石。药根在水里轻轻摆动。"
    exits:
      west: [0, 2]
      north: [1, 3]

  - position: [0, 3]
    id: yaowang_medical_yard
    name: "药圃"
    desc: "药圃分成许多小畦，每畦都挂着禁采的牌子。"
    exits:
      south: [0, 2]
      north: [0, 4]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: yaowang_pulse_room
    name: "切脉房"
    desc: "房中只有一张木榻和三盏小灯。灯火用来照脸色，不用来照刀。"
    exits:
      east: [0, 3]
      south: [-1, 2]
      north: [-1, 4]

  - position: [1, 3]
    id: yaowang_decoction_room
    name: "煎药房"
    desc: "数十只药罐同时冒着白气，苦味里有一点回甘。"
    exits:
      west: [0, 3]
      south: [1, 2]
      north: [1, 4]

  - position: [0, 4]
    id: yaowang_hall
    name: "百草堂"
    desc: "堂中悬着一块木匾：医人先医心。木匾下坐着一位白发医者。"
    char:
      - yaowang_senior
    exits:
      south: [0, 3]
      north: [0, 5]
      west: [-1, 4]
      east: [1, 4]

  - position: [-1, 4]
    id: yaowang_teacher_room
    name: "静息室"
    desc: "室内铺着蒲草席，墙上画着简单经络图。"
    char:
      - yaowang_teacher
    exits:
      east: [0, 4]
      south: [-1, 3]

  - position: [1, 4]
    id: yaowang_formula_room
    name: "方书阁"
    desc: "架上医书很多，夹在书页里的药香比墨香更重。"
    exits:
      west: [0, 4]
      south: [1, 3]

  - position: [0, 5]
    id: yaowang_inner_grove
    name: "内谷林"
    desc: "林中更深处暂未开放。以后这里会接入采药、解毒和疗伤 job。"
    exits:
      south: [0, 4]
