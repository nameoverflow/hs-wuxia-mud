id: north_post_road
name: "北郊递道"
desc: "开封北门外通往黄河渡口的旧递道。北来的公文、塘报都从这里过河进城。松林很密，近来常有公文在这里失踪。"
rooms:
  - position: [0, 0]
    id: north_road_south_marker
    name: "旧道南口"
    desc: "石碑上刻着“北郊递道”四个字，旁边另有驿卒补刻的小字：去黄河渡口三十里，天黑莫行。"
    exits:
      south:
        map: kaifeng_city
        position: [0, 5]
      north: [0, 1]

  - position: [0, 1]
    id: north_road_low_road
    name: "低松驿路"
    desc: "松枝压得很低，车马经过时常要低头。"
    exits:
      south: [0, 0]
      north: [0, 2]

  - position: [0, 2]
    id: north_road_relay_pavilion
    name: "递铺亭"
    desc: "旧递铺亭里只剩一张条凳和几只空信筒，墙上贴着开封府的告示。"
    char:
      - roadside_runner
    exits:
      south: [0, 1]
      north: [0, 3]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: north_post_roadside_shrine
    name: "路边小祠"
    desc: "小祠里供着无名边卒牌位，香灰被雨吹成细线。"
    exits:
      east: [0, 2]
      north: [-1, 3]

  - position: [1, 2]
    id: north_road_hunter_shed
    name: "猎户棚"
    desc: "棚里有几张旧弓和半锅冷粥，主人离开得很匆忙。"
    exits:
      west: [0, 2]
      north: [1, 3]

  - position: [0, 3]
    id: north_road_fork
    name: "旧道岔口"
    desc: "官道在这里分出两条小径。西边脚印杂乱，东边是采药人走的坡道。"
    exits:
      south: [0, 2]
      north: [0, 4]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: north_road_hidden_path
    name: "藏身小径"
    desc: "小径被松针盖住，只有常来的人才知道该往哪里落脚。"
    char:
      - mail_thief_spy
    exits:
      east: [0, 3]
      south: [-1, 2]

  - position: [1, 3]
    id: north_road_herb_slope
    name: "药草坡"
    desc: "坡上长着几丛车前和蒲公英，采药人的竹篓压出的印子还新。"
    exits:
      west: [0, 3]
      south: [1, 2]

  - position: [0, 4]
    id: north_road_abandoned_shrine
    name: "废军祠"
    desc: "废祠门歪着，门后有新烧过的灰，说明近来有人在此落脚。"
    exits:
      south: [0, 3]
      north: [0, 5]

  - position: [0, 5]
    id: north_road_levee
    name: "黄河南堤"
    desc: "大堤横在北面，堤下黄水翻着泥沙。渡口的船要到天明才开，守渡军士只验公牒，不许无故过河。"
    exits:
      south: [0, 4]
