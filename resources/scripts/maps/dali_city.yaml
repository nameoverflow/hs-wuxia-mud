id: dali_city
name: "大理城"
desc: "西南王城，苍山在西，洱海在东，王府、寺门和茶马商队在城中交错。"
rooms:
  - position: [0, 0]
    id: dali_teahorse_post
    name: "茶马驿门"
    desc: "门房里堆着押运文书、茶包和几根油亮短棍。"
    exits:
      south:
        map: bianliang_city
        position: [2, 2]
      north: [0, 1]

  - position: [0, 1]
    id: dali_cart_yard
    name: "茶马车场"
    desc: "车辙在泥里交错，护卫正在清点南下商队的货箱。"
    char:
      - dali_caravan_guard
    exits:
      south: [0, 0]
      north: [0, 2]

  - position: [0, 2]
    id: dali_outer_yard
    name: "王城外院"
    desc: "院里没有花树，只有石锁、沙袋和成排的短棍。"
    exits:
      south: [0, 1]
      north: [0, 3]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: dali_stone_lock
    name: "石锁棚"
    desc: "石锁大大小小排成一列，旁边写着：先搬得动自己。"
    exits:
      east: [0, 2]
      north: [-1, 3]

  - position: [1, 2]
    id: dali_gear_room
    name: "护具房"
    desc: "护腕、短甲和旧靴挂满一墙，补丁比皮面还多。"
    exits:
      west: [0, 2]
      north: [1, 3]

  - position: [0, 3]
    id: dali_drill_ground
    name: "王府操练场"
    desc: "地上画着十几道白线，护卫沿线练习进退和护送阵形。"
    exits:
      south: [0, 2]
      north: [0, 4]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: dali_oath_wall
    name: "誓墙"
    desc: "墙上刻着商队规矩。字不多，最深的一句是：受托护人，失人偿命。"
    exits:
      east: [0, 3]
      south: [-1, 2]
      north: [-1, 4]

  - position: [1, 3]
    id: dali_kitchen
    name: "大灶房"
    desc: "灶上常年有粥，远行归来的人先喝一碗，再说话。"
    exits:
      west: [0, 3]
      south: [1, 2]
      north: [1, 4]

  - position: [0, 4]
    id: dali_hall
    name: "王府外堂"
    desc: "堂中挂着一件破护甲，旁边记录着几次茶马道护送的伤亡。"
    char:
      - dali_guard_captain
    exits:
      south: [0, 3]
      north: [0, 5]
      west: [-1, 4]
      east: [1, 4]

  - position: [-1, 4]
    id: dali_teacher_room
    name: "传功屋"
    desc: "屋中没有蒲团，只有一张厚木桌。桌角被拳头砸得发黑。"
    char:
      - dali_teacher
    exits:
      east: [0, 4]
      south: [-1, 3]

  - position: [1, 4]
    id: dali_contract_room
    name: "路契房"
    desc: "桌上压着许多茶马路契。纸薄，责任却很重。"
    exits:
      west: [0, 4]
      south: [1, 3]

  - position: [0, 5]
    id: dali_locked_arsenal
    name: "天龙寺山门"
    desc: "山门前有王府护卫与寺中执事共同守着。没有手书的人，只能在阶下听见晚钟。"
    exits:
      south: [0, 4]
