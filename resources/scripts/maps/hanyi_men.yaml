id: hanyi_men
name: "寒雨门"
desc: "寒雨门依山而建，门中人少说话，多听雨。"
rooms:
  - position: [0, 0]
    id: hanyi_receiving_pavilion
    name: "接引亭"
    desc: "亭中挂着一柄无锋木剑。来客若不说话，雨声便替他报名。"
    exits:
      south:
        map: jinguan_town
        position: [-2, 2]
      north: [0, 1]

  - position: [0, 1]
    id: hanyi_wet_steps
    name: "湿石阶"
    desc: "石阶上常年有水，脚步稍急便会滑出去半寸。"
    exits:
      south: [0, 0]
      north: [0, 2]

  - position: [0, 2]
    id: hanyi_outer_gate
    name: "寒雨外门"
    desc: "门额没有金漆，只用冷墨写着寒雨二字。"
    char:
      - hanyi_gate_disciple
    exits:
      south: [0, 1]
      north: [0, 3]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: hanyi_sword_rack
    name: "木剑架"
    desc: "木剑排列得极齐，每柄剑柄上都有淡淡雨痕。"
    exits:
      east: [0, 2]
      north: [-1, 3]

  - position: [1, 2]
    id: hanyi_rain_gallery
    name: "听雨廊"
    desc: "廊外雨水顺瓦滴下，快慢正好能数步法。"
    exits:
      west: [0, 2]
      north: [1, 3]

  - position: [0, 3]
    id: hanyi_practice_court
    name: "练剑坪"
    desc: "坪上没有靶子。寒雨门练剑，只斩落下来的雨。"
    exits:
      south: [0, 2]
      north: [0, 4]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: hanyi_listening_room
    name: "听声房"
    desc: "房中极静，静到能听见袖中剑鞘轻轻摩擦。"
    exits:
      east: [0, 3]
      south: [-1, 2]
      north: [-1, 4]

  - position: [1, 3]
    id: hanyi_guest_room
    name: "客舍"
    desc: "客舍里只有一张竹榻、一盏灯和一壶永远不热的茶。"
    exits:
      west: [0, 3]
      south: [1, 2]
      north: [1, 4]

  - position: [0, 4]
    id: hanyi_inner_hall
    name: "寒雨堂"
    desc: "堂中没有供像，只挂着一面空墙。墙上每一道水迹都像剑路。"
    char:
      - hanyi_senior
    exits:
      south: [0, 3]
      north: [0, 5]
      west: [-1, 4]
      east: [1, 4]

  - position: [-1, 4]
    id: hanyi_script_room
    name: "残谱室"
    desc: "架上多是残谱，完整的反而少见。守室人说，完整之物多半是假的。"
    char:
      - hanyi_teacher
    exits:
      east: [0, 4]
      south: [-1, 3]

  - position: [1, 4]
    id: hanyi_cold_pool
    name: "冷泉"
    desc: "泉水从石缝里出来，清得像一柄不肯出鞘的剑。"
    exits:
      west: [0, 4]
      south: [1, 3]

  - position: [0, 5]
    id: hanyi_sealed_terrace
    name: "封剑台"
    desc: "台上有一道旧剑痕。现在这里还没有开放，只留下给后续章节的空位。"
    exits:
      south: [0, 4]
