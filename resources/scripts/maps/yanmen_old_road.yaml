id: yanmen_old_road
name: "雁门递道南线"
desc: "开封北去边关的旧驿路南段，专递雁门边报，江湖人便把这一线都叫作雁门旧道。松林很密，近来常有边报在这里失踪。"
rooms:
  - position: [0, 0]
    id: yanmen_south_marker
    name: "旧道南口"
    desc: "石碑上刻着雁门旧道四个字，旁边另有驿卒补刻的小字：此为南线，天黑莫行。"
    exits:
      south:
        map: kaifeng_city
        position: [0, 4]
      north: [0, 1]

  - position: [0, 1]
    id: yanmen_low_road
    name: "低松驿路"
    desc: "松枝压得很低，车马经过时常要低头。"
    exits:
      south: [0, 0]
      north: [0, 2]

  - position: [0, 2]
    id: yanmen_relay_pavilion
    name: "递铺亭"
    desc: "旧递铺亭里空空如也，墙上贴着开封府的告示。"
    char:
      - roadside_runner
    exits:
      south: [0, 1]
      north: [0, 3]
      west: [-1, 2]
      east: [1, 2]

  - position: [-1, 2]
    id: yanmen_old_roadside_shrine
    name: "路边小祠"
    desc: "小祠里供着无名边卒牌位，香灰被雨吹成细线。"
    exits:
      east: [0, 2]
      north: [-1, 3]

  - position: [1, 2]
    id: yanmen_hunter_shed
    name: "猎户棚"
    desc: "棚里有几张旧弓和半锅冷粥，主人离开得很匆忙。"
    exits:
      west: [0, 2]
      north: [1, 3]

  - position: [0, 3]
    id: yanmen_fork
    name: "旧道岔口"
    desc: "官道在这里分出两条小径。西边脚印杂乱，东边药香很淡。"
    exits:
      south: [0, 2]
      north: [0, 4]
      west: [-1, 3]
      east: [1, 3]

  - position: [-1, 3]
    id: yanmen_hidden_path
    name: "藏身小径"
    desc: "小径被松针盖住，只有常来的人才知道该往哪里落脚。"
    char:
      - yanmen_spy
    exits:
      east: [0, 3]
      south: [-1, 2]

  - position: [1, 3]
    id: yanmen_herb_slope
    name: "药草坡"
    desc: "坡上长着几丛苦草。雨打过以后，药气反而更重。"
    exits:
      west: [0, 3]
      south: [1, 2]

  - position: [0, 4]
    id: yanmen_abandoned_shrine
    name: "废军祠"
    desc: "废祠门歪着，门后有新烧过的灰，说明近来有人在此落脚。"
    exits:
      south: [0, 3]
      north: [0, 5]

  - position: [0, 5]
    id: yanmen_ridge_overlook
    name: "雁门望处"
    desc: "岭北云沉得很低，旧关卡横在风口。守关军士只验边牒，不许无故北行。"
    exits:
      south: [0, 4]
