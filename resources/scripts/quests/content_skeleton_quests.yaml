- id: first_steps_kaifeng
  name: "开封落脚"
  objectives:
    - stage: guide
      text: "离开威远镖局，到开封南门找人问路。"
    - stage: inn
      text: "去鼓楼西边的樊楼客舍，先找个能过夜的地方。"
    - stage: training
      text: "去府前街武馆见梁教头，为自己选一条安身练功的路。"
    - stage: practice
      text: "与武馆练招木人试几招，熟悉开封武馆的规矩。"
    - stage: first_job
      text: "在府学、铁铺或药铺做一份活，挣到第一笔工钱。"
    - stage: completed
      text: "你有了住处、练功门路和一枚工筹，可以自行安排往后的江湖生活。"
  reward:
    money: 0
    items: []
  events:
    - id: guide_after_weiyuan_orphan
      trigger:
        type: talk
        npc: kaifeng_guide
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: guide
        - type: flag
          flag: creation.origin.orphan
      actions:
        - type: message
          speaker: "周引路"
          text: "看你站门洞、避差役的样子，像是从小自己讨生活。开封不比小地方，先找张能闩门的床。鼓楼西边有樊楼客舍，报我姓周，伙计会给你留间后房。"
        - type: set_stage
          quest: first_steps_kaifeng
          stage: inn

    - id: guide_after_weiyuan
      trigger:
        type: talk
        npc: kaifeng_guide
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: guide
        - type: not_flag
          flag: creation.origin.orphan
      actions:
        - type: message
          speaker: "周引路"
          text: "第一次进开封，别急着问事。鼓楼西边有樊楼客舍，报我姓周，伙计会给你留间后房。先把湿衣换了，再想明日往哪里走。"
        - type: set_stage
          quest: first_steps_kaifeng
          stage: inn

    - id: guide_after_weiyuan_unstarted
      trigger:
        type: talk
        npc: kaifeng_guide
      conditions:
        - type: quest_completed
          quest: weiyuan_bloody_case
        - type: quest_not_started
          quest: first_steps_kaifeng
      actions:
        - type: message
          speaker: "周引路"
          text: "第一次进开封，先找住处。鼓楼西边有樊楼客舍，报我姓周，伙计会给你留间后房。"
        - type: set_stage
          quest: first_steps_kaifeng
          stage: inn

    - id: guide_reminds_fanlou
      trigger:
        type: talk
        npc: kaifeng_guide
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: inn
      actions:
        - type: message
          speaker: "周引路"
          text: "沿府前大街往北到鼓楼，再往西一拐就是樊楼客舍。先住下，别在门洞里过夜。"

    - id: fanlou_refuses_before_guide
      trigger:
        type: talk
        npc: fanlou_innkeeper
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: guide
      actions:
        - type: message
          speaker: "樊楼伙计"
          text: "客房不缺，肯替生客作保的人难找。南门周引路若让你来，我便给你开后院那间。"

    - id: lodge_at_fanlou
      trigger:
        type: talk
        npc: fanlou_innkeeper
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: inn
      actions:
        - type: message
          speaker: "樊楼伙计"
          text: "周引路的人情只够一晚。往后房钱照算，若愿意替店里跑腿，也能抵账。"
        - type: transition
          text: "伙计领你穿过灶房，在后院推开一扇窄门。"
          ms: 800
        - type: give_item
          item: kaifeng_room_tag
          amount: 1
        - type: message
          speaker: "旁白"
          text: "房里只有竹榻、油灯和一只旧木箱。地方虽小，门闩尚算结实。你把水浸路单压进箱底，没有再看。"
        - type: set_flag
          flag: kaifeng.has_room
        - type: set_stage
          quest: first_steps_kaifeng
          stage: training
        - type: message
          speaker: "樊楼伙计"
          text: "明早若想找练功门路，去府前街武馆见梁教头。若只想挣钱，城里也有的是活。"

    - id: fanlou_after_lodging
      trigger:
        type: talk
        npc: fanlou_innkeeper
      conditions:
        - type: quest_completed
          quest: first_steps_kaifeng
      actions:
        - type: message
          speaker: "樊楼伙计"
          text: "后院房牌既在你手里，天黑前回来便有人留门。若欠了房钱，我也会记得。"

    - id: confirm_basics_martial_family
      trigger:
        type: talk
        npc: kaifeng_martial_instructor
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: training
        - type: flag
          flag: creation.origin.martial_family
      actions:
        - type: message
          speaker: "梁教头"
          text: "你这站架有人教过，只是一路赶得心浮。家传的规矩我不问，到了我的场子，先对木人把呼吸和脚步找回来。"
        - type: show_npc
          npc: kaifeng_training_dummy
        - type: set_stage
          quest: first_steps_kaifeng
          stage: practice

    - id: confirm_basics_at_martial_hall
      trigger:
        type: talk
        npc: kaifeng_martial_instructor
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: training
        - type: not_flag
          flag: creation.origin.martial_family
      actions:
        - type: message
          speaker: "梁教头"
          text: "你脚步虚，心却急。先别忙着拜师，对场边木人试几招。我只看你会不会护住自己。"
        - type: show_npc
          npc: kaifeng_training_dummy
        - type: set_stage
          quest: first_steps_kaifeng
          stage: practice

    - id: start_martial_hall_practice
      trigger:
        type: talk
        npc: kaifeng_training_dummy
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: practice
      actions:
        - type: message
          speaker: "梁教头"
          text: "木人不会留手，你也不必留力。站稳了再出招。"
        - type: start_battle
          target: kaifeng_training_dummy

    - id: finish_martial_hall_practice
      trigger:
        type: kill
        npc: kaifeng_training_dummy
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: practice
      actions:
        - type: hide_npc
          npc: kaifeng_training_dummy
        - type: set_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: message
          speaker: "梁教头"
          text: "还不算稳，但知道什么时候该退。往后想学什么，拿潜能和工夫来换。眼下先去挣顿饭钱。"

    - id: first_job_scribe_scholar
      trigger:
        type: talk
        npc: old_scribe
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: flag
          flag: creation.origin.scholar_house
      actions:
        - type: message
          speaker: "沈抄书"
          text: "这笔画不像临时学的。替我誊完这页失物榜，字要清楚，人名尤其不能错。"
        - type: delay
          ms: 700
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.scribe
        - type: complete_quest
          quest: first_steps_kaifeng

    - id: first_job_scribe_official
      trigger:
        type: talk
        npc: old_scribe
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: flag
          flag: creation.origin.official_house
      actions:
        - type: message
          speaker: "沈抄书"
          text: "你拿公牒的手势像见过衙门文书。替我把这页告示誊清，别把官样文章写进百姓名字里。"
        - type: delay
          ms: 700
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.scribe
        - type: complete_quest
          quest: first_steps_kaifeng

    - id: first_job_scribe
      trigger:
        type: talk
        npc: old_scribe
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: not_flag
          flag: creation.origin.scholar_house
        - type: not_flag
          flag: creation.origin.official_house
      actions:
        - type: message
          speaker: "沈抄书"
          text: "照着这一页慢慢誊，认不准的字便问。名字写错一笔，寻人的路就会多绕十里。"
        - type: delay
          ms: 700
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.scribe
        - type: complete_quest
          quest: first_steps_kaifeng

    - id: first_job_blacksmith
      trigger:
        type: talk
        npc: kaifeng_blacksmith
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
      actions:
        - type: message
          speaker: "赵铁匠"
          text: "替我踩住风箱。火色发白便慢，发暗便加力，别光顾着看热闹。"
        - type: delay
          ms: 700
        - type: message
          speaker: "旁白"
          text: "一炉铁烧透时，你的衣背也被汗浸透。赵铁匠把十文钱和一枚工筹拍在砧边。"
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.blacksmith
        - type: complete_quest
          quest: first_steps_kaifeng

    - id: first_job_physician_family
      trigger:
        type: talk
        npc: kaifeng_physician
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: flag
          flag: creation.origin.medicine_house
      actions:
        - type: message
          speaker: "柳药师"
          text: "你闻药时先辨根叶，家里应当开过药柜。替我分这几包止血散，分量照旧，不必卖弄方子。"
        - type: delay
          ms: 700
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.physician
        - type: complete_quest
          quest: first_steps_kaifeng

    - id: first_job_physician
      trigger:
        type: talk
        npc: kaifeng_physician
      conditions:
        - type: quest_stage
          quest: first_steps_kaifeng
          stage: first_job
        - type: not_flag
          flag: creation.origin.medicine_house
      actions:
        - type: message
          speaker: "柳药师"
          text: "把写着止血二字的药包分到左边，认不准便闻一闻。错一包，伤者就要多流一碗血。"
        - type: delay
          ms: 700
        - type: give_money
          amount: 10
        - type: give_item
          item: kaifeng_work_token
          amount: 1
        - type: set_flag
          flag: kaifeng.first_job.physician
        - type: complete_quest
          quest: first_steps_kaifeng

- id: yanmen_patrol
  name: "雁门旧道巡查"
  objectives:
    - stage: accepted
      text: "沿北门出城，到雁门旧道递铺亭查探失信之事。"
    - stage: found_tracks
      text: "循着被擦过的马蹄印，到旧道西侧小径查问拦路人。"
    - stage: confronting
      text: "制住拦路探子，找回递铺失去的信物。"
    - stage: report
      text: "回开封府捕房向顾捕头复命。"
    - stage: completed
      text: "失信案已经报回开封府，雁门旧道暂时恢复通行。"
  reward:
    money: 0
    items: []
  events:
    - id: constable_starts_patrol
      trigger:
        type: talk
        npc: kaifeng_constable
      conditions:
        - type: quest_completed
          quest: first_steps_kaifeng
        - type: quest_not_started
          quest: yanmen_patrol
      actions:
        - type: message
          speaker: "顾捕头"
          text: "北门递铺少了两封边报。你若想接一件正经差事，就去亭里看一眼；见到人先问话，别追过旧道岔口。"
        - type: set_stage
          quest: yanmen_patrol
          stage: accepted

    - id: inspect_relay_pavilion
      trigger:
        type: enter_room
        map: yanmen_old_road
        position: [0, 2]
      conditions:
        - type: quest_stage
          quest: yanmen_patrol
          stage: accepted
        - type: not_flag
          flag: yanmen.tracks_seen
      actions:
        - type: set_flag
          flag: yanmen.tracks_seen
        - type: show_npc
          npc: yanmen_spy
        - type: set_stage
          quest: yanmen_patrol
          stage: found_tracks
        - type: message
          speaker: "旁白"
          text: "亭柱后有一串被松枝扫过的马蹄印，仍能看出向西折进小径。泥里还压着半截断掉的信筒铜扣。"

    - id: confront_yanmen_spy
      trigger:
        type: talk
        npc: yanmen_spy
      conditions:
        - type: quest_stage
          quest: yanmen_patrol
          stage: found_tracks
      actions:
        - type: message
          speaker: "雁门探子"
          text: "开封府养的脚倒快。信已经不在我身上，你若还想问，只能先让我闭不了你的嘴。"
        - type: set_stage
          quest: yanmen_patrol
          stage: confronting
        - type: start_battle
          target: yanmen_spy

    - id: defeat_yanmen_spy
      trigger:
        type: kill
        npc: yanmen_spy
      conditions:
        - type: quest_stage
          quest: yanmen_patrol
          stage: confronting
      actions:
        - type: hide_npc
          npc: yanmen_spy
        - type: give_item
          item: yanmen_wooden_badge
          amount: 1
        - type: set_stage
          quest: yanmen_patrol
          stage: report
        - type: message
          speaker: "旁白"
          text: "探子袖中掉出一块递铺木牌，背面刻着交接时辰。失去的边报已被送往更北处，眼下只能先把木牌带回开封府。"

    - id: constable_completes_patrol
      trigger:
        type: talk
        npc: kaifeng_constable
      conditions:
        - type: quest_stage
          quest: yanmen_patrol
          stage: report
      actions:
        - type: message
          speaker: "顾捕头"
          text: "木牌留下，后面的路由官差去追。你守住了我说的分寸，这五十文是捕房出的脚钱。"
        - type: give_money
          amount: 50
        - type: complete_quest
          quest: yanmen_patrol

- id: three_city_leads
  name: "远行门路"
  objectives:
    - stage: choose_route
      text: "到北街问洛阳车马行、大理商队或太湖药车，选定第一次远行的方向。"
    - stage: completed
      text: "三处接引点已经认得你。往后想远行时，找对应接引人即可。"
  reward:
    money: 0
    items: []
  events:
    - id: guide_opens_travel_routes
      trigger:
        type: talk
        npc: kaifeng_guide
      conditions:
        - type: quest_completed
          quest: first_steps_kaifeng
        - type: quest_not_started
          quest: three_city_leads
      actions:
        - type: message
          speaker: "周引路"
          text: "住处和工筹都有了，便不必总守着南门。北街有三拨远行人：洛阳车马行、大理商队、太湖药车。先选一处走走，余下的路以后再认。"
        - type: set_stage
          quest: three_city_leads
          stage: choose_route

    - id: choose_luoyang_route
      trigger:
        type: talk
        npc: luoyang_runner
      conditions:
        - type: quest_stage
          quest: three_city_leads
          stage: choose_route
      actions:
        - type: message
          speaker: "洛阳接引人"
          text: "洛阳的车午后出发。那里的人先看名帖，再看剑；你若没有名帖，就带一件愿意当众说清来历的东西。"
        - type: give_item
          item: three_city_route_pass
          amount: 1
        - type: set_flag
          flag: travel.first.luoyang
        - type: complete_quest
          quest: three_city_leads
        - type: transition
          text: "车轮沿官道向西，开封城声渐渐落在身后。"
          ms: 1000
        - type: move_player
          map: luoyang_city
          position: [0, 0]

    - id: choose_dali_route
      trigger:
        type: talk
        npc: dali_runner
      conditions:
        - type: quest_stage
          quest: three_city_leads
          stage: choose_route
      actions:
        - type: message
          speaker: "大理商队护卫"
          text: "南下路远，商队不白载人。一路替我照看后车，到了大理，吃住和脚钱都按护卫例算。"
        - type: give_item
          item: three_city_route_pass
          amount: 1
        - type: set_flag
          flag: travel.first.dali
        - type: complete_quest
          quest: three_city_leads
        - type: transition
          text: "商队沿茶马道南下，城郭、平原与山路依次退向身后。"
          ms: 1000
        - type: move_player
          map: dali_city
          position: [0, 0]

    - id: choose_taihu_route
      trigger:
        type: talk
        npc: taihu_runner
      conditions:
        - type: quest_stage
          quest: three_city_leads
          stage: choose_route
      actions:
        - type: message
          speaker: "太湖药童"
          text: "药车不赶夜路，也不收闲客。你若肯沿途看着药箱，到了湖边，我替你向水榭报一声姓名。"
        - type: give_item
          item: three_city_route_pass
          amount: 1
        - type: set_flag
          flag: travel.first.taihu
        - type: complete_quest
          quest: three_city_leads
        - type: transition
          text: "药铃一路向东，空气里的水气渐渐重了。"
          ms: 1000
        - type: move_player
          map: taihu_water_pavilion
          position: [0, 0]

    - id: travel_to_luoyang_again
      trigger:
        type: talk
        npc: luoyang_runner
      conditions:
        - type: quest_completed
          quest: three_city_leads
      actions:
        - type: message
          speaker: "洛阳接引人"
          text: "西行车马正要出发。路引带好，途中少管驿卒不肯说的事。"
        - type: transition
          text: "车轮沿官道向西，开封城声渐渐落在身后。"
          ms: 900
        - type: move_player
          map: luoyang_city
          position: [0, 0]

    - id: travel_to_dali_again
      trigger:
        type: talk
        npc: dali_runner
      conditions:
        - type: quest_completed
          quest: three_city_leads
      actions:
        - type: message
          speaker: "大理商队护卫"
          text: "后车还缺一个照看货绳的人。想南下便跟紧，掉队没人回头找。"
        - type: transition
          text: "商队沿茶马道南下，城郭、平原与山路依次退向身后。"
          ms: 900
        - type: move_player
          map: dali_city
          position: [0, 0]

    - id: travel_to_taihu_again
      trigger:
        type: talk
        npc: taihu_runner
      conditions:
        - type: quest_completed
          quest: three_city_leads
      actions:
        - type: message
          speaker: "太湖药童"
          text: "药箱已经点齐。若去太湖，帮我听着车铃，少一声便要停车。"
        - type: transition
          text: "药铃一路向东，空气里的水气渐渐重了。"
          ms: 900
        - type: move_player
          map: taihu_water_pavilion
          position: [0, 0]
