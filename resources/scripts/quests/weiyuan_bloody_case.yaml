id: weiyuan_bloody_case
name: "威远镖局旧案"
objectives:
  - stage: intruder
    text: "破庙外有人追来，挡住闯入的黑衣人。"
  - stage: duel
    text: "击退黑衣人，保住老镖师和灰衣少年。"
  - stage: escort_dying
    text: "回头查看老镖师的伤势。"
  - stage: escort_road
    text: "沿汴水官道护送灰衣少年到开封城南的威远分局，把路单交给骆主事。"
  - stage: branch_gate
    text: "陪灰衣少年进威远镖局，看看里面是否还有活口。"
  - stage: inner_court
    text: "灰衣少年冲进了内院。跟过去看看。"
  - stage: completed
    text: "灰衣少年留书出走。你替他收着路单和剑谱，先在开封找个落脚处。"
reward:
  money: 0
  combat_exp: 20
  potential: 10
  items: []
events:
  - id: young_escort_before_warning
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_not_started
        quest: weiyuan_bloody_case
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "嘘——外头的人还没走远。陈伯伤得重，你先听他说。"

  - id: old_escort_warns_in_temple
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_not_started
        quest: weiyuan_bloody_case
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "别点火。追兵循着镖车的辙印摸到了这里，庙里一亮，谁也走不了。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: intruder
      - type: message
        speaker: "旁白"
        text: "话音未落，庙门外响起急促脚步。半扇破门被人一脚踹开，雨水和冷风一起灌进殿里。"
      - type: show_npc
        npc: temple_black_clad
      - type: message
        speaker: "黑衣人"
        text: "威远的人果然在这里。今夜这座庙里，不该再有活口。"
      - type: message
        speaker: "受伤老镖师"
        text: "少侠，若我倒下，替我把这孩子带到开封城南的威远分局。"

  - id: old_escort_urges_fight
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "他左肋挨过我一剑，脚下已经虚了，只是不肯认。别让他靠近孩子。"

  - id: young_escort_urges_fight
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "他剑上还有血……我的腿不听使唤。少侠，小心。"

  - id: black_clad_forces_fight
    trigger:
      type: talk
      npc: temple_black_clad
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "黑衣人"
        text: "你不是威远的人，本可以晚死一步。现在既然站在这里，就一起留下。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: duel
      - type: start_battle
        target: temple_black_clad

  - id: black_clad_defeated
    trigger:
      type: kill
      npc: temple_black_clad
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: duel
    actions:
      - type: hide_npc
        npc: temple_black_clad
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
      - type: message
        speaker: "旁白"
        text: "黑衣人倒在门边。老镖师扶着断柱站起，才迈出半步，便又重重坐了下去。"
      - type: message
        speaker: "旁白"
        text: "黑衣人的袖口翻开，腕上刺着一圈细密墨线，像一道没写完的符。他左肋的旧伤还在渗血。"
      - type: set_flag
        flag: weiyuan.saw_ink_mark

  - id: young_escort_after_fight
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "陈伯方才一直撑着。少侠，快去看看他。"

  - id: old_escort_last_request
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "我走不动了。包袱底有三十文盘缠，还有这趟镖的底单。把孩子和底单一起送到威远分局，交到他爹骆主事手里。"
      - type: give_money
        amount: 30
      - type: give_item
        item: soaked_route_note
        amount: 1
      - type: delay
        ms: 1800
      - type: message
        speaker: "受伤老镖师"
        text: "若镖局也出了事，不要逞强。人活着，才有资格管别人的旧账。"
      - type: message
        speaker: "旁白"
        text: "老镖师说完这句，攥着你衣袖的手慢慢松开了。少年跪在他身边，替他合上眼，把自己的斗笠盖在他脸上。"
      - type: message
        speaker: "灰衣少年"
        text: "陈伯，等我回来给你收尸。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: escort_road
      - type: hide_npc
        npc: wounded_escort
      - type: transition
        text: "你与少年冒雨离开破庙，踏上汴水官道。"
        ms: 1800
      - type: move_player
        map: bianshui_road
        position: [0, 0]
      - type: message
        speaker: "灰衣少年"
        text: "沿汴水往北先到南渡，过州桥才是城门。追兵未必只有一个，我们别在路上停。"

  - id: young_escort_on_road
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_road
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "北面已经能看见州桥和城灯了。威远分局就在南渡东边，我爹今夜该在柜上。"

  - id: reach_kaifeng_with_young_escort
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [0, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_road
    actions:
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
      - type: message
        speaker: "旁白"
        text: "城里的灯火越过州桥映在汴水上。少年抹去脸上的雨，指向渡口东边一块黑漆门匾。"
      - type: message
        speaker: "灰衣少年"
        text: "那里就是威远分局。可门口的灯笼，怎么一盏都没点？"

  - id: young_escort_at_branch_gate
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "门没上闩，里面却没有灯。你若肯，再陪我走到前厅。"

  - id: enter_weiyuan_branch_hall
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [2, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
    actions:
      - type: message
        speaker: "旁白"
        text: "前厅门扇半开。镖旗被砍断，账册散在血水里，廊柱后倒着几名镖师，已经没了声息。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "灰衣少年"
        text: "早上出镖时，他们还在点账……爹！娘！"
      - type: message
        speaker: "旁白"
        text: "少年把背上的包袱往你怀里一塞，跌跌撞撞冲进了通往内院的月门。"
      - type: give_item
        item: weiyuan_sword_manual
        amount: 1
      - type: hide_npc
        npc: grey_young_escort
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: inner_court

  - id: find_youth_gone_in_inner_court
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [3, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: inner_court
    actions:
      - type: message
        speaker: "旁白"
        text: "内院正房的门开着，里面没有活人。少年不在这里，后门半掩，泥地上一串脚印朝河边去了。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "旁白"
        text: "井台的青石上有几行新刻的字，是用剑尖匆匆划出来的。"
      - type: message
        speaker: "灰衣少年（井台刻字）"
        text: "包袱里是我爹手抄的剑谱，底单陈伯交给了你。两样都替我收着，它们留在我身上，我活不过今夜。别找我。找我的人，会顺着你找到我。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "旁白"
        text: "南渡那头忽然亮起一串灯笼，有人在喊：“威远分局出事了，快去报官！”脚步声正朝前门来。"
      - type: set_flag
        flag: weiyuan.youth_separated
      - type: set_flag
        flag: weiyuan.route_note_kept
      - type: set_stage
        quest: first_steps_kaifeng
        stage: guide
      - type: complete_quest
        quest: weiyuan_bloody_case
      - type: transition
        text: "你从后门出去，贴着河堤绕到柳岸码头，身后的灯笼越聚越多。"
        ms: 2000
      - type: move_player
        map: kaifeng_city
        position: [-1, -3]
      - type: message
        speaker: "旁白"
        text: "柳树下蹲着个抽旱烟的汉子。他看了你一眼，又看了一眼威远分局的后墙，什么也没说。"
