- id: luoyang_sword
  name: "洛阳剑法"
  type: sword
  desc: "洛阳旧都流传的入门剑法，讲究步法、出剑角度和截断来势。"
  foundation: basic_sword
  requires:
    - art: basic_sword
      level: 1
  max_level: 40
  attack_moves:
    - id: luoyang_bridge_cut
      name: "天津桥斜斩"
      desc: "借桥头宽阔地势，斜斩对手外门。"
      msg: "踏上半步，斜斩外门"
      unlock_level: 1
      damage: 13
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash"]
    - id: luoyang_wine_thread_stab
      name: "洛水直刺"
      desc: "剑尖顺酒盏边缘递出，轻而直。"
      msg: "剑尖平直刺向中路"
      unlock_level: 4
      damage: 16
      animation:
        action: rig.sword.thrust_a
        tags: ["sword", "stab"]
  active_skills:
    - id: luoyang_intercept_cut
      name: "截脉剑"
      desc: "看准对手发力，半路截住手臂。"
      msg: "看准来势，剑锋截入手臂"
      unlock_level: 3
      cd: 8.0
      target: Single
      cost: 35
      ap_req: 65
      req_status: []
      damage: 48
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash", "counter"]
      effect:
        self: []
        target:
          - id: weakened
            duration: 8.0
            value: 1

- id: dali_guard_fist
  name: "茶马护身拳"
  type: fist
  desc: "大理茶马路上传下来的入门拳法。拳架低，步子沉，适合护送和近身防守。"
  foundation: basic_fist
  requires:
    - art: basic_fist
      level: 1
  max_level: 40
  attack_moves:
    - id: dali_door_push
      name: "推门势"
      desc: "肩肘同时前压，逼开近身的对手。"
      msg: "沉肩推肘，拳势如推重门"
      unlock_level: 1
      damage: 12
      animation:
        action: rig.fist.punch_a
        tags: ["fist", "strike"]
    - id: dali_iron_elbow
      name: "铁肘"
      desc: "拳未必到，肘先撞进来。"
      msg: "近身撞出一记铁肘"
      unlock_level: 5
      damage: 18
      animation:
        action: rig.fist.heavy_a
        tags: ["fist", "heavy", "strike"]
  active_skills:
    - id: dali_cover_body
      name: "护身劲"
      desc: "沉气护住要害，减轻接下来的伤势。"
      msg: "沉气护身，守住要害"
      unlock_level: 2
      cd: 14.0
      target: Self
      cost: 35
      ap_req: 45
      req_status: []
      animation:
        action: rig.fist.guard
        tags: ["buff", "self"]
      effect:
        self:
          - id: iron_body_buff
            duration: 12.0
            value: 3
        target: []

