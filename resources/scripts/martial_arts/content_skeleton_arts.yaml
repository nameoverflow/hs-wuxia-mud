- id: luoyang_sword
  name: "洛阳剑法"
  type: sword
  tier: regional
  desc: "相传是旧都天津桥上一位不肯报名的剑客所遗，后经牡丹会世代剑客增补，讲究步法、出剑角度和截断来势。洛阳剑客以此剑示名：出剑之前，先报姓名。"
  foundation: basic_sword
  requires:
    - art: basic_sword
      level: 10
  max_level: 40
  attack_moves:
    - id: luoyang_bridge_cut
      name: "天津桥斜斩"
      desc: "借桥头宽阔地势，斜斩对手外门。"
      msg: "踏上半步，斜斩外门"
      unlock_level: 1
      damage: 13
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash"]
    - id: luoyang_wine_thread_stab
      name: "洛水直刺"
      desc: "剑尖顺酒盏边缘递出，轻而直。"
      msg: "剑尖平直刺向中路"
      unlock_level: 4
      damage: 16
      animation:
        action: rig.sword.thrust_a
        tags: ["sword", "stab"]
  active_skills:
    - id: luoyang_intercept_cut
      name: "截脉剑"
      desc: "看准对手发力，半路截住手臂。"
      msg: "看准来势，剑锋截入手臂"
      unlock_level: 3
      cd: 8.0
      target: Single
      cost: 35
      ap_req: 65
      req_status: []
      damage: 48
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash", "counter"]
      effect:
        self: []
        target:
          - id: weakened
            duration: 8.0
            value: 1

- id: dali_guard_fist
  name: "茶马护身拳"
  type: fist
  tier: regional
  desc: "段氏旧府护院为茶马商队编的拳法。拳架低，步子沉，适合护送和近身防守。段家失了王位，以护送商路为生，这套拳便成了段家对外示人的功夫；真正的家传，从不在人前露。"
  foundation: basic_fist
  requires:
    - art: basic_fist
      level: 10
  max_level: 40
  attack_moves:
    - id: dali_door_push
      name: "推门势"
      desc: "肩肘同时前压，逼开近身的对手。"
      msg: "沉肩推肘，拳势如推重门"
      unlock_level: 1
      damage: 12
      animation:
        action: rig.fist.punch_a
        tags: ["fist", "strike"]
    - id: dali_iron_elbow
      name: "铁肘"
      desc: "拳未必到，肘先撞进来。"
      msg: "近身撞出一记铁肘"
      unlock_level: 5
      damage: 18
      animation:
        action: rig.fist.heavy_a
        tags: ["fist", "heavy", "strike"]
  active_skills:
    - id: dali_cover_body
      name: "落桩劲"
      desc: "两脚落桩，沉气护住要害，减轻接下来的伤势。"
      msg: "两脚落桩，沉气守住要害"
      unlock_level: 2
      cd: 14.0
      target: Self
      cost: 35
      ap_req: 45
      req_status: []
      animation:
        action: rig.fist.guard
        tags: ["buff", "self"]
      effect:
        self:
          - id: iron_body_buff
            duration: 12.0
            value: 3
        target: []

- id: taihu_breath
  name: "太湖调息"
  type: internal
  tier: regional
  desc: "太湖水榭医者代代相传的调息法，本为行医时稳住自己的气息，后来才拿它疗伤。先调息，再辨寒热虚实。水榭规矩：只传给认过的人。"
  foundation: basic_internal
  requires:
    - art: basic_internal
      level: 10
  max_level: 40
  active_skills:
    - id: taihu_return_breath
      name: "回息"
      desc: "以缓息回护气血，能救急，不能贪用。"
      msg: "缓缓吐纳，气息从伤处回转"
      unlock_level: 2
      cd: 12.0
      target: Self
      cost: 45
      ap_req: 40
      req_status: []
      heal: 45
      animation:
        action: rig.fist.healing_palm
        tags: ["heal", "self"]
      effect:
        self: []
        target: []

- id: mist_step
  name: "烟水步"
  type: lightness
  tier: regional
  desc: "太湖渡口的摇橹人和水榭药童在湿滑石岸上练出来的步法，重在不让脚步声先出卖自己。"
  foundation: basic_lightness
  requires:
    - art: basic_lightness
      level: 10
  max_level: 40
