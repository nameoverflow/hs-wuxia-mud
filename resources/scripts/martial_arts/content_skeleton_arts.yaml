- id: hanyi_rain_sword
  name: "寒雨剑"
  type: sword
  desc: "寒雨门入门剑法。剑不求快，先求在雨声里听见对手换气。"
  foundation: basic_sword
  requires:
    - art: basic_sword
      level: 1
  max_level: 40
  attack_moves:
    - id: hanyi_drop_cut
      name: "檐滴一斩"
      desc: "等檐水落到一半时出剑，斩的不是水，是对方的迟疑。"
      msg: "听檐水一落，斜斜斩出一剑"
      unlock_level: 1
      damage: 13
      animation:
        pool: "weapon.sword.basic"
        action: "sword.slash_a"
        tags: ["sword", "slash"]
    - id: hanyi_thread_stab
      name: "雨线一刺"
      desc: "剑尖顺雨线递出，轻而直。"
      msg: "顺着雨线平平刺出"
      unlock_level: 4
      damage: 16
      animation:
        pool: "weapon.sword.basic"
        action: "sword.stab_a"
        tags: ["sword", "stab"]
  active_skills:
    - id: hanyi_listen_cut
      name: "听声截脉"
      desc: "先听一步，再截半寸。"
      msg: "侧耳一听，剑锋从半路截入"
      unlock_level: 3
      cd: 8.0
      target: Single
      cost: 35
      ap_req: 65
      req_status: []
      damage: 48
      animation:
        pool: "weapon.sword.basic"
        action: "sword.slash_a"
        tags: ["sword", "slash", "counter"]
      effect:
        self: []
        target:
          - id: weakened
            duration: 8.0
            value: 1

- id: tieyi_gate_fist
  name: "铁衣拳"
  type: fist
  desc: "铁衣帮入门拳法。拳架低，步子沉，出手像推门。"
  foundation: basic_fist
  requires:
    - art: basic_fist
      level: 1
  max_level: 40
  attack_moves:
    - id: tieyi_door_push
      name: "推门势"
      desc: "肩肘同时前压，像把一扇沉门推开。"
      msg: "沉肩推肘，拳势如推重门"
      unlock_level: 1
      damage: 12
      animation:
        pool: "weapon.fist.basic"
        tags: ["fist", "strike"]
    - id: tieyi_iron_elbow
      name: "铁肘"
      desc: "拳未必到，肘先撞进来。"
      msg: "近身撞出一记铁肘"
      unlock_level: 5
      damage: 18
      animation:
        pool: "weapon.fist.basic"
        tags: ["fist", "heavy", "strike"]
  active_skills:
    - id: tieyi_cover_body
      name: "披铁衣"
      desc: "一口气沉入皮骨，硬接该接的一下。"
      msg: "气沉皮骨，身形像披上一层暗铁"
      unlock_level: 2
      cd: 14.0
      target: Self
      cost: 35
      ap_req: 45
      req_status: []
      animation:
        pool: "skill.fist_focus"
        action: "skill.fist_focus.guard"
        tags: ["buff", "self"]
      effect:
        self:
          - id: iron_body_buff
            duration: 12.0
            value: 3
        target: []

