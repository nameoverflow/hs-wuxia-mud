- id: kaifeng_work_token
  name: "开封工筹"
  desc: "一枚木筹，背面刻着开封二字。城里做过活的人，都会有这么一枚。"

- id: kaifeng_room_tag
  name: "樊楼房牌"
  desc: "樊楼客舍后院小房的木牌。房间不大，但门闩还能合上。"

- id: yanmen_wooden_badge
  name: "递铺木牌"
  desc: "从截信探子袖中掉出的递铺木牌，背面刻着一组交接时辰，边角还粘着封信筒用的红蜡。"

- id: three_city_route_pass
  name: "同行帖"
  desc: "车马行、商队和药车互相认的同行凭帖，写着你的姓名和第一次同行的日子。它不是官府路引，只保证车上有你一个位置。"
